
name: Build Study Planner Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare website files
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          mkdir -p www
          cp index.html app.js main.js sync.js style.css www/
          cp sw.js manifest.webmanifest completion.mp3 uncheck.mp3 www/
          cp -R icons www/

          node - <<'NODE'
          const fs = require('fs');
          const keys = [
            'FIREBASE_API_KEY',
            'FIREBASE_AUTH_DOMAIN',
            'FIREBASE_PROJECT_ID',
            'FIREBASE_STORAGE_BUCKET',
            'FIREBASE_MESSAGING_SENDER_ID',
            'FIREBASE_APP_ID'
          ];
          for (const key of keys) {
            if (!process.env[key]) {
              throw new Error('Missing GitHub Secret: ' + key);
            }
          }
          const config = {
            apiKey: process.env.FIREBASE_API_KEY,
            authDomain: process.env.FIREBASE_AUTH_DOMAIN,
            projectId: process.env.FIREBASE_PROJECT_ID,
            storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
            messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
            appId: process.env.FIREBASE_APP_ID
          };
          fs.writeFileSync(
            'www/firebase-config.js',
            'window.firebaseConfig = ' + JSON.stringify(config) + ';'
          );
          NODE

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Configure Android app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.irfankukku.studyplanner",
            "appName": "Study Planner",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Apply Study Planner app icon
        run: |
          python3 -m venv /tmp/iconenv
          /tmp/iconenv/bin/pip install pillow
          /tmp/iconenv/bin/python - <<'PY'
          from PIL import Image, ImageFilter, ImageDraw
          import os
          res = 'android/app/src/main/res'
          big = Image.open('icons/icon-512.png').convert('RGB').resize((1024, 1024), Image.LANCZOS)
          blur = big.filter(ImageFilter.GaussianBlur(40))
          def clip(im, shape):
              m = Image.new('L', im.size, 0)
              d = ImageDraw.Draw(m)
              if shape == 'circle':
                  d.ellipse((0, 0) + im.size, fill=255)
              else:
                  d.rounded_rectangle((0, 0) + im.size, radius=int(im.size[0] * 0.22), fill=255)
              o = im.convert('RGBA')
              o.putalpha(m)
              return o
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for name, (l, a) in sizes.items():
              p = res + '/mipmap-' + name
              os.makedirs(p, exist_ok=True)
              small = big.resize((l, l), Image.LANCZOS)
              clip(small, 'square').save(p + '/ic_launcher.png')
              clip(small, 'circle').save(p + '/ic_launcher_round.png')
              blur.resize((a, a), Image.LANCZOS).save(p + '/ic_launcher_bg.png')
              fg = Image.new('RGBA', (a, a), (0, 0, 0, 0))
              s = int(a * 0.84)
              fg.paste(big.resize((s, s), Image.LANCZOS), ((a - s) // 2, (a - s) // 2))
              fg.save(p + '/ic_launcher_fg.png')
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@mipmap/ic_launcher_bg"/>\n    <foreground android:drawable="@mipmap/ic_launcher_fg"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(res + '/mipmap-anydpi-v26/' + n + '.xml', 'w').write(xml)
          PY
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          # Gradle download from services.gradle.org can time out (default 10s): raise timeout and retry
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          grep -q '^networkTimeout' gradle/wrapper/gradle-wrapper.properties || echo 'networkTimeout=120000' >> gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3; do
            ./gradlew assembleDebug && exit 0
            echo "Attempt $i failed, retrying in 15s..."; sleep 15
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Planner-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
