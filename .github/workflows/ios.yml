
name: Build Study Planner iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare website
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          mkdir -p www
          cp index.html app.js main.js sync.js style.css sw.js manifest.webmanifest www/
          cp -R icons www/

          node - <<'NODE'
          const fs = require('fs');
          const keys = [
            'FIREBASE_API_KEY',
            'FIREBASE_AUTH_DOMAIN',
            'FIREBASE_PROJECT_ID',
            'FIREBASE_STORAGE_BUCKET',
            'FIREBASE_MESSAGING_SENDER_ID',
            'FIREBASE_APP_ID'
          ];
          for (const key of keys) {
            if (!process.env[key]) throw new Error('Missing secret: ' + key);
          }
          const config = {
            apiKey: process.env.FIREBASE_API_KEY,
            authDomain: process.env.FIREBASE_AUTH_DOMAIN,
            projectId: process.env.FIREBASE_PROJECT_ID,
            storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
            messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
            appId: process.env.FIREBASE_APP_ID
          };
          fs.writeFileSync(
            'www/firebase-config.js',
            'window.firebaseConfig = ' + JSON.stringify(config) + ';'
          );
          NODE

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Configure iOS app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.irfankukku.studyplanner",
            "appName": "Study Planner",
            "webDir": "www"
          }
          EOF

      - name: Create iOS project
        run: npx cap add ios

      - name: Apply Study Planner app icon
        run: |
          sips -z 1024 1024 icons/icon-512.png --out /tmp/AppIcon.png
          find ios/App/App/Assets.xcassets/AppIcon.appiconset -name '*.png' -exec cp /tmp/AppIcon.png {} \;

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r StudyPlanner-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Study-Planner-iOS-IPA
          path: StudyPlanner-unsigned.ipa
