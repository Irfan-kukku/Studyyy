<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f9">
<title>Study Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Planner">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root"></div>
<!-- Trigger Button -->
<button id="openModalBtn" class="p">Open macOS Window</button>

<!-- Modal Overlay & Window -->
<div id="macosModal" class="macos-modal-overlay">
  <div class="macos-window">
    <!-- Titlebar -->
    <div class="macos-titlebar">
      <div class="traffic-lights">
        <button class="dot dot-close" id="closeModalBtn" aria-label="Close"></button>
        <button class="dot dot-minimize" aria-label="Minimize"></button>
        <button class="dot dot-expand" aria-label="Expand"></button>
      </div>
      <div class="macos-title">Study Planner Preferences</div>
    </div>
    
    <!-- Body Content -->
    <div class="macos-content">
      <h3>macOS Animation Effect</h3>
      <p>This window pops up smoothly using a custom spring physics curve mimicking macOS system popups.</p>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
<script src="main.js"></script>
</body>
</html>
