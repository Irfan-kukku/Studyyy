<body>
<div id="root"></div>
<script>
  /* Native app (APK/IPA) live-update: the installed app bundles an old copy of the site.
     On launch, if the hosted site is reachable, load it instead (always latest). Offline -> bundled copy. */
  (function(){
    var REMOTE = 'https://irfan-kukku.github.io/Studyyy/';
    try {
      var p = location.protocol, h = location.hostname;
      var native = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
                   p === 'capacitor:' || (p === 'https:' && h === 'localhost');
      if (!native || location.href.indexOf(REMOTE) === 0) return;
      var root = document.documentElement;
      root.style.visibility = 'hidden';
      var done = false;
      var show = function(){ if (done) return; done = true; root.style.visibility = ''; };
      var ctl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function(){ if (ctl) ctl.abort(); show(); }, 3000);
      fetch(REMOTE + 'sw.js?_t=' + Date.now(), { cache: 'no-store', mode: 'cors', signal: ctl ? ctl.signal : undefined })
        .then(function(r){
          clearTimeout(timer);
          if (r && r.ok && !done) { done = true; location.replace(REMOTE); } else { show(); }
        })
        .catch(function(){ clearTimeout(timer); show(); });
    } catch (e) { document.documentElement.style.visibility = ''; }
  })();
</script>
<script>
  /* Clean up any broken OTA cache that could block booting */
  try {
    localStorage.removeItem('sp.ota.js');
    localStorage.removeItem('sp.ota.css');
  } catch (e) {}
</script>
